name: Release

on:
  push:
    branches: [master]
  # Shows the images a release would publish, so a change to them is checked before it ships.
  pull_request:
    paths: [.github/workflows/release.yml, docker-bake.hcl]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release pull request
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      # Not GITHUB_TOKEN: GitHub starts no CI for pull requests it opens.
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.token.outputs.token }}

  images:
    name: Images (${{ matrix.arch }})
    if: needs.release-please.outputs.created == 'true'
    needs: release-please
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        env:
          TAG: ${{ needs.release-please.outputs.tag }}-${{ matrix.arch }}
          VERSION: ${{ needs.release-please.outputs.tag }}
          ARCH: ${{ matrix.arch }}
          CACHE: write
          REVISION: ${{ needs.release-please.outputs.sha }}
        with:
          source: .
          files: docker-bake.hcl
          push: true
          provenance: mode=max
          sbom: true
          # The source label links each package to this repository, whose registry_package
          # webhook tells ops' Flux to deploy it.
          set: |
            *.labels.org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            *.labels.org.opencontainers.image.version=${{ needs.release-please.outputs.tag }}
            *.labels.org.opencontainers.image.revision=${{ needs.release-please.outputs.sha }}

  # One entry per image, named by the bake file with the release's tag.
  targets:
    name: Images to publish
    needs: release-please
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || needs.release-please.outputs.created == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha || github.sha }}
      - id: matrix
        uses: docker/bake-action/subaction/matrix@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        env:
          TAG: ${{ needs.release-please.outputs.tag || 'v0.0.0' }}
        with:
          files: docker-bake.hcl
          fields: tags
      - name: Show them
        env:
          MATRIX: ${{ steps.matrix.outputs.matrix }}
        run: echo "$MATRIX"

  join:
    name: Join ${{ matrix.target }}
    needs: [targets, images]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.matrix) }}
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Join the architectures under the version's tag
        env:
          REF: ${{ matrix.tags }}
        run: docker buildx imagetools create -t "$REF" "$REF-amd64" "$REF-arm64"

  # The drafted release goes public only once all its images exist.
  publish:
    name: Publish
    needs: [release-please, join]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
